[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moscollector-contour"
version = "0.1.0"
description = "Predictive maintenance and incident triage for engineering collectors"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.3,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=19,<24",
  "catboost>=1.2.8,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7,<1",
  "pydantic-settings>=2.8,<3",
  "ldap3>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]
research = [
  "scikit-learn>=1.7,<2",
  "scipy>=1.13,<2",
  "joblib>=1.3,<2",
  "threadpoolctl>=3.1,<4",
  "py7zr>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]
