include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/inetorgperson.schema
modulepath /usr/lib/ldap
moduleload back_mdb
pidfile /tmp/contour-slapd.pid
argsfile /tmp/contour-slapd.args
TLSCACertificateFile /certs/fullchain.pem
TLSCertificateFile /certs/fullchain.pem
TLSCertificateKeyFile /certs/privkey.pem
database mdb
maxsize 104857600
suffix "dc=contour,dc=test"
rootdn "cn=admin,dc=contour,dc=test"
rootpw "local-directory-fixture-only"
directory /var/lib/contour-test
access to attrs=userPassword by anonymous auth by self write by * none
access to * by users read by * none
